config-version: 2

name: "data_dbt_architecture"
version: "3.0.0"
require-dbt-version: ">=1.12.0"

profile: default # Put your profile here

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["data-tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  data_dbt_architecture:
    +schema: raw
    ecom:
      +enabled: "{{ var('load_source_data', false) }}"
      raw_users:
        +column_types:
          id: varchar
          name: varchar
          email: varchar
          phone: varchar
          status: varchar
          created_at: timestamp
      raw_customer_users:
        +column_types:
          id: varchar
          customer_id: varchar
          user_id: varchar
          relationship_role: varchar
          is_primary_contact: boolean
          valid_from: timestamp
          valid_to: timestamp
      raw_addresses:
        +column_types:
          id: varchar
          address_line_1: varchar
          city: varchar
          state: varchar
          postal_code: varchar
          country_code: varchar
          created_at: timestamp
      raw_customer_addresses:
        +column_types:
          id: varchar
          customer_id: varchar
          address_id: varchar
          address_usage: varchar
          is_default_address: boolean
          valid_from: timestamp
          valid_to: timestamp
      raw_order_address_snapshots:
        +column_types:
          id: varchar
          order_id: varchar
          customer_id: varchar
          source_address_id: varchar
          address_line_1: varchar
          city: varchar
          state: varchar
          postal_code: varchar
          country_code: varchar
          captured_at: timestamp
    inputs:
      # Governed manual/business-maintained inputs fixture. Gated behind the same
      # var as the other seeds so a plain `dbt seed` (no vars) does not silently
      # populate a "production-looking" governed input from a local fixture.
      +enabled: "{{ var('load_source_data', false) }}"
      raw_customer_marketing_exclusions:
        +column_types:
          customer_id: varchar
          is_excluded: boolean
          exclusion_reason: varchar
          valid_from: timestamp
          valid_to: timestamp
          updated_by: varchar
          updated_at: timestamp

models:
  data_dbt_architecture:
    "0. landing":
      +materialized: view
      "0. external":
        +schema: source_json
        +meta:
          grain: one source CDC event
          model_class: source-faithful external ingestion
          maturity: private
          intended_consumers: [landing]
      "1. raw":
        +schema: landing
        +meta:
          grain: one current source key
          model_class: current landing record
          maturity: private
          intended_consumers: [staging]
    "1. staging":
      +materialized: view
      +schema: staging
      +meta:
        grain: one current source object
        model_class: source-specific staging model
        maturity: private
        intended_consumers: [logical, core, systems, cross_cutting_quality_controls]
    "2a. core":
      +materialized: table
      +schema: core
      +meta:
        grain: one canonical entity/event/relationship
        model_class: canonical core interface
        maturity: certified
        intended_consumers: [core, logical, marts, reporting, semantic, operational]
    "2b. systems":
      +materialized: view
      +schema: systems
      +meta:
        grain: one current source-conformed staging object
        model_class: staging access view
        maturity: private
        intended_consumers: [controlled_source_access]
    "3. logical":
      # Logical materializes as a view by default: reusable, but not ephemeral.
      +materialized: view
      +schema: logical
      +meta:
        grain: one reusable transformation result at declared model grain
        model_class: reusable logical transformation
        maturity: reusable
        intended_consumers: [core, marts, reporting, semantic, operational]
    "4. marts":
      +materialized: table
      +schema: marts
      +meta:
        maturity: reusable
      dimensions:
        +schema: marts
      facts:
        +schema: marts
        +meta:
          maturity: certified
    "5a. reporting":
      # Small/derived; view keeps it cheap and always current on top of table-materialized marts.
      +materialized: view
      +schema: reporting
      +meta:
        grain: one current customer
        model_class: consumer-facing report
        maturity: consumer_specific
        intended_consumers: [customer_360_review, business_operations]
    "5b. semantic":
      +enabled: true
      +meta:
        grain: semantic support object
        model_class: semantic support model
        maturity: certified
        intended_consumers: [semantic_definitions]
    "5c. operational":
      # Frozen machine-consumed contract: table materialization.
      +materialized: table
      +schema: operational
      +meta:
        grain: one operational delivery record
        model_class: operational delivery contract
        maturity: certified
        intended_consumers: [external_operational_consumers]

flags:
  require_generic_test_arguments_property: true
