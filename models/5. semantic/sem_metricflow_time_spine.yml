version: 2

models:
  - name: sem_metricflow_time_spine
    description: MetricFlow time spine used for day-grain semantic metrics.
    config:
      schema: semantic
      alias: metricflow_time_spine
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: Calendar date at day grain.
        granularity: day
        data_tests: [not_null, unique]
